services:
  frontend:
    build:
      context: ./frontend
      args:
        PAYGUARD_API_URL: http://backend:8081
    environment:
      PAYGUARD_API_URL: http://backend:8081
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://payguard:payguard@postgres:5432/payguard?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PAYGUARD_ADDR: 0.0.0.0:8081
      PAYGUARD_DEMO_MERCHANT_A_TOKEN: ${PAYGUARD_DEMO_MERCHANT_A_TOKEN:-}
      PAYGUARD_DEMO_MERCHANT_B_TOKEN: ${PAYGUARD_DEMO_MERCHANT_B_TOKEN:-}
      PAYGUARD_DEMO_BASELINE_MIN_SAMPLES: ${PAYGUARD_DEMO_BASELINE_MIN_SAMPLES:-}
      PAYGUARD_DEMO_ANALYST_A_TOKEN: ${PAYGUARD_DEMO_ANALYST_A_TOKEN:-}
      PAYGUARD_DEMO_ANALYST_A2_TOKEN: ${PAYGUARD_DEMO_ANALYST_A2_TOKEN:-}
      PAYGUARD_DEMO_VIEWER_A_TOKEN: ${PAYGUARD_DEMO_VIEWER_A_TOKEN:-}
      PAYGUARD_DEMO_ANALYST_B_TOKEN: ${PAYGUARD_DEMO_ANALYST_B_TOKEN:-}
      PAYGUARD_DEMO_VIEWER_B_TOKEN: ${PAYGUARD_DEMO_VIEWER_B_TOKEN:-}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payguard
      POSTGRES_USER: payguard
      POSTGRES_PASSWORD: payguard
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - payguard_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payguard -d payguard"]
      interval: 2s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  payguard_data:
