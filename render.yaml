services:
  - type: web
    name: payguard-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: PAYGUARD_ADDR
        value: 0.0.0.0:10000
      - key: DATABASE_URL
        fromDatabase:
          name: payguard-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: payguard-redis
          type: keyvalue
          property: connectionString
      - key: ENTITY_KEY_SECRET
        generateValue: true
      - key: PAYGUARD_DEMO_MERCHANT_A_TOKEN
        generateValue: true
      - key: PAYGUARD_DEMO_MERCHANT_B_TOKEN
        generateValue: true

  - type: web
    name: payguard-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: PAYGUARD_API_URL
        fromService:
          name: payguard-backend
          type: web
          property: host
      - key: PAYGUARD_BOOKING_API_URL
        fromService:
          name: payguard-backend
          type: web
          property: host

  - type: keyvalue
    name: payguard-redis
    plan: free
    ipAllowList: []

databases:
  - name: payguard-postgres
    databaseName: payguard
    plan: free
